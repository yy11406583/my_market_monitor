name: 2-Hour Smart Monitor V3

on:
  schedule:
    # 每 15 分钟运行一次，确保能捕捉到 8:00-8:29 的早报窗口
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [manual_trigger]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 加入 --no-cache-dir 強制重新下載
          pip install --no-cache-dir requests beautifulsoup4 yfinance pandas lxml akshare flagmoji country_converter
          # 打印驗證信息，確認包是否真的裝上了
          pip show flagmoji

      - name: Execute Monitor Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python super_monitor.py

      - name: Commit and push news history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 包含所有產生的紀錄檔
          touch sent_news.txt sent_links.txt sent_rthk_links.txt etf_data_cache.json
          git add sent_news.txt sent_links.txt sent_rthk_links.txt etf_data_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news history [skip ci]" && git push origin main)
